[project]
name = "pinnslicer"
version = "0.1.0"
description = "PINN-Slicer: physics-informed neural network for black-hole photon orbits"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.26",
    "scipy>=1.10",
    "torch>=2.2",
    "pyyaml>=6.0",
]

# Local Jupyter setup only. Colab already provides ipython/ipykernel, so
# install with plain `pip install -e .` there and `pip install -e ".[notebooks]"`
# on a local machine.
[project.optional-dependencies]
notebooks = [
    "ipython>=8.0",
    "ipykernel>=6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pinnslicer*"]

[project.urls]
"Homepage" = "https://github.com/soot-bit/pinnslicer"
